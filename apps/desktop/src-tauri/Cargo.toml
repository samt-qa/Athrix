[package]
name = "athrix-desktop"
description = "Athrix desktop app (Tauri 2 + SolidJS)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue #8519 on Windows).
name = "athrix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
athrix-core.workspace = true
athrix-fs-index.workspace = true
athrix-query.workspace = true
athrix-text-ar.workspace = true
nass.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
