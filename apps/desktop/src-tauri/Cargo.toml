[package]
name = "athrix-desktop"
description = "Athrix desktop app (Tauri 2 + SolidJS)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue #8519 on Windows).
name = "athrix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
athrix-content-index.workspace = true
athrix-core.workspace = true
# Not in [workspace.dependencies] yet (root Cargo.toml is outside this change): path dep.
athrix-daemon.workspace = true
# `dupe:` searches: size grouping, BLAKE3 hashing and the hash cache.
athrix-dedupe.workspace = true
athrix-extract.workspace = true
athrix-fs-index.workspace = true
# `similar:` and "find similar images": perceptual hashes, grouping and the hash cache.
athrix-imagehash.workspace = true
# The MCP settings file (Settings → MCP); the server itself is the `athrix-mcp` sidecar.
athrix-mcp-server.workspace = true
# Drive-letter probe (serial numbers) for noticing USB drives plugged in / removed.
athrix-ntfs.workspace = true
athrix-query.workspace = true
athrix-ranking.workspace = true
athrix-store.workspace = true
athrix-text-ar.workspace = true
nass.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-opener.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
serde.workspace = true
serde_json.workspace = true
# Volume listing for the drive picker (mount point, label, removable): a safe wrapper over
# GetVolumeInformationW / GetDriveTypeW (the crate denies `unsafe`). Only the `disk` feature.
# 0.36 is the last line building on Rust 1.85 (0.37+ needs 1.88).
sysinfo = { version = "0.36", default-features = false, features = ["disk"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
# Builds small .docx files for the content-search tests.
zip.workspace = true
# Writes small pictures for the similar-image tests.
image.workspace = true

[lints]
workspace = true
