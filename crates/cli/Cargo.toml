[package]
name = "athrix-cli"
description = "Athrix command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "athrix"
path = "src/main.rs"

[dependencies]
athrix-core.workspace = true
athrix-fs-index.workspace = true
athrix-text-ar.workspace = true
# `athrix bench` (docs/PERF-AUDIT.md)
athrix-content-index.workspace = true
athrix-extract.workspace = true
athrix-query.workspace = true
# `athrix interpret`: today's local date for relative phrases («قبل 3 أيام»).
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
athrix-ranking.workspace = true
sysinfo = { workspace = true, features = ["system"] }

[lints]
workspace = true
