[package]
name = "athrix-mcp-server"
description = "Athrix MCP server: lets AI assistants search the user's files (read-only, opt-in, allowed folders only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# Package name differs from the sidecar binary name: cargo names per-package build
# directories after the package, and tauri-build copies the `athrix-mcp` sidecar next to
# them, so equal names collide ("Is a directory").
[lib]
name = "athrix_mcp"
path = "src/lib.rs"

[[bin]]
name = "athrix-mcp"
path = "src/main.rs"

[dependencies]
athrix-content-index.workspace = true
# Built WITHOUT the `pdf` feature: PDFs go through the isolated worker process only.
athrix-extract.workspace = true
athrix-fs-index.workspace = true
athrix-query.workspace = true
athrix-ranking.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
