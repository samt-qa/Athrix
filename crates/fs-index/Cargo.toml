[package]
name = "athrix-fs-index"
description = "File-name index: parallel walk, NTFS MFT/USN on Windows, live watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
athrix-core.workspace = true
athrix-query.workspace = true
athrix-text-ar.workspace = true
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
crc32fast = "1.5.5"
globset = "0.4.18"
jwalk = "0.8.1"
memchr = "2.7.4"
rayon = "1.10.0"
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[[bench]]
name = "index"
harness = false

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true
