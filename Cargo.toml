[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Samt Software"]
repository = "https://github.com/samt-qa/Athrix"
publish = false

[workspace.dependencies]
# Internal crates
athrix-core = { path = "crates/core" }
athrix-fs-index = { path = "crates/fs-index" }
athrix-query = { path = "crates/query" }
athrix-text-ar = { path = "crates/text-ar" }
athrix-extract = { path = "crates/extract" }
athrix-content-index = { path = "crates/content-index" }
athrix-semantic = { path = "crates/semantic" }
athrix-ranking = { path = "crates/ranking" }
athrix-store = { path = "crates/store" }
athrix-ntfs = { path = "crates/ntfs" }

# Desktop app
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# External
nass = "0.4"
notify = "8.2" # 9.x needs Rust 1.91; the workspace MSRV is 1.85
thiserror = "2"
windows-sys = "0.61" # same major as Tauri's transitive copy: no duplicate build
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# athrix-content-index: 0.26+ needs a newer Rust than the 1.85 MSRV. No zstd (C build): lz4 doc store.
tantivy = { version = "=0.25.0", default-features = false, features = ["mmap", "lz4-compression"] }
tempfile = "3"
# athrix-extract: pure-Rust parsers only (no C builds)
zip = { version = "7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.38"
encoding_rs = "0.8.35" # 0.8.36+ may need a newer Rust; resolver 3 keeps a 1.85-compatible one
chardetng = "1"
# athrix-extract `pdf` feature (opt-in). 0.11+ pulls lopdf 0.42, which uses let-chains and fails on 1.85.
pdf-extract = "=0.10.0"
unicode-normalization = "0.1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# athrix-extract worker binary: counting global allocator for its heap cap (pure Rust, no deps).
cap = "0.1.2"
# athrix-daemon: CPU load for auto-pause (same 0.36 the desktop app already builds; 0.37+ needs newer Rust)
sysinfo = { version = "0.36", default-features = false }
# athrix-daemon: AC/battery state without `unsafe` in our code. 0.11+ needs Rust 1.89.
starship-battery = "0.10.2"
# athrix-daemon: lower worker-thread priority through a safe API (MSRV 1.85)
thread-priority = "3.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
